version: 2
updates:
  # Keep workflow actions current so runner-runtime deprecations don't pile up again.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Conventional Commits titles, which the PR title check requires: "ci(deps): bump …".
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
