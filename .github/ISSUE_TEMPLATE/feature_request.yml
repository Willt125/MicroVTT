name: Feature request
description: Something MicroVTT could do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. This repository is **public**: anything you post here can be read by anyone.
        The [manual](https://github.com/Willt125/MicroVTT/blob/main/docs/MANUAL.md) lists what the editor already does, in case it is there under another name.
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: The task, not the feature. For example, "time a long interview quickly from the keyboard".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What you do now in MicroVTT or another tool, and what gets in the way.
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Your idea of how it could work. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Other editors that do it well, sample cues (nothing private), screenshots…
  - type: checkboxes
    id: public
    attributes:
      label: Public repository
      options:
        - label: I understand this request is public, and it has nothing private or that I may not share.
          required: true
