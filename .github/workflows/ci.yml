name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the development default (.nvmrc); 22 is the oldest supported (package.json engines).
        node: ['22', '24']
    name: check (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # For the ffmpeg (libavformat) parser comparison in packages/core/test/players.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The ffmpeg comparison again with ffmpeg 7.0, which reads WebVTT differently from the
      # distribution's 6.1 (see packages/core/test/players/ffmpeg.test.ts). The binary comes in
      # the imageio-ffmpeg wheel, pinned by its hash.
      - name: ffmpeg 7 comparison
        if: matrix.node == '24'
        run: |
          python3 -m venv "$RUNNER_TEMP/ffmpeg7"
          echo 'imageio-ffmpeg==0.6.0 --hash=sha256:c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282' > "$RUNNER_TEMP/ffmpeg7.txt"
          "$RUNNER_TEMP/ffmpeg7/bin/pip" install --quiet --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/ffmpeg7.txt"
          export FFMPEG="$("$RUNNER_TEMP/ffmpeg7/bin/python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -version | head -1
          pnpm exec vitest run --project core packages/core/test/players/ffmpeg.test.ts
      - run: pnpm build
      - run: pnpm build:single
      # The single-file editor, to download and try from disk.
      - uses: actions/upload-artifact@v7
        if: matrix.node == '24'
        with:
          name: microvtt-single-file
          path: apps/web/dist-single/microvtt.html
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: e2e (${{ matrix.browser }})
    # A hung browser otherwise holds the job for hours, without uploading its log.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @microvtt/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm e2e --project=${{ matrix.browser }}
        env:
          # The WPT rendering reftests in every browser, with one result line per test.
          WPT_ALL_BROWSERS: '1'
          WPT_REPORT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.browser }}
          path: apps/web/test-results/
          retention-days: 7
