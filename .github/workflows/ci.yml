name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the development default (.nvmrc); 22 is the oldest supported (package.json engines).
        node: ['22', '24']
    name: check (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # For the ffmpeg (libavformat) parser comparison in packages/core/test/players.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: e2e (${{ matrix.browser }})
    # A hung browser otherwise holds the job for hours, without uploading its log.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @microvtt/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.browser }}
          path: apps/web/test-results/
          retention-days: 7
